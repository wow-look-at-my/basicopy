name: CI

on:
  push:
    branches: ['**']

concurrency:
  group: gha_${{ github.repository }}_${{ github.workflow }}_${{ github.ref != 'refs/heads/master' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  id-token: write
  contents: write
  actions: read
  checks: read
  deployments: write
  artifact-metadata: write

jobs:
  test:
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      # The suites need the host's node and the xattr tools, which only bwrap shares. The docker fallback image has neither.
      - uses: wow-look-at-my/actions@cached-apt#latest
        with:
          packages: attr bubblewrap
      - name: Let bwrap open a user namespace
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: wow-look-at-my/go-toolchain@lkgb
      - name: Stage the binary for the other hosts
        shell: bash
        run: mkdir -p build/handoff && cp build/basicopy build/handoff/basicopy
      - uses: wow-look-at-my/buildhost/.github/actions/buildhost-handoff@lkgb
        with:
          mode: send
          name: basicopy
          path: build/handoff

  # The one APE the test job built, run on each host it ships for. The suites run unsandboxed: no host but Linux has a backend for every one.
  every-host:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include: ${{ github.event.repository.visibility == 'public' && fromJSON('[{"os":"ubuntu-latest","host":"linux"},{"os":"macos-latest","host":"darwin"},{"os":"windows-latest","host":"windows"}]') || fromJSON('[{"os":"ubuntu-latest","host":"linux"}]') }}
    runs-on: ${{ (github.event.repository.visibility == 'public' || !contains(fromJSON('["ubuntu-latest"]'), matrix.os)) && matrix.os || vars.CI_RUNNER || matrix.os }}
    timeout-minutes: 20
    env:
      GO_TOOLCHAIN_DATS_BUILD_DIR: build/bin
      XPLAT_OUT: build/xplat-out
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        uses: wow-look-at-my/actions@cached-apt#latest
        with:
          packages: attr
      - uses: wow-look-at-my/buildhost/.github/actions/buildhost-handoff@lkgb
        with:
          mode: receive
          name: basicopy
          path: build/bin
      - id: dats
        uses: wow-look-at-my/buildhost/.github/actions/buildhost-download@lkgb
        with:
          project: dats
      # NT finds an executable by its extension. A posix host does not care, so every leg uses the .exe names.
      - name: Data, metadata, and the cross-host fixture
        shell: bash
        run: |
          set -euo pipefail
          cp "${{ steps.dats.outputs.path }}" build/dats.exe
          cp build/bin/basicopy build/bin/basicopy.exe
          chmod +x build/dats.exe build/bin/basicopy build/bin/basicopy.exe
          mkdir -p "$XPLAT_OUT"
          ./build/dats.exe -v --no-sandbox test dats/data.dats dats/metadata.dats xplat/produce.dats
      # Temporary: the hand-off's tar crashes on this tree on Windows, and this names the entry it cannot archive.
      - name: Probe the hand-off tar here
        if: runner.os == 'Windows'
        shell: bash
        run: |
          p="$PWD/build/tarprobe"
          rm -rf "$p"; mkdir -p "$p"
          probe() {
            if tar -c -f "$p/out.tar" -C "$1" . >/dev/null 2>&1; then echo "tar archives $2"; else echo "tar FAILS on $2"; fi
            rm -f "$p/out.tar"
          }
          mkdir -p "$p/plain"; echo hi > "$p/plain/a.txt"; probe "$p/plain" plain-file
          mkdir -p "$p/filelink"; echo hi > "$p/filelink/t.txt"; ln -s t.txt "$p/filelink/s"; probe "$p/filelink" file-symlink
          mkdir -p "$p/dangling"; ln -s no-such-target "$p/dangling/s"; probe "$p/dangling" dangling-symlink
          mkdir -p "$p/dirlink/real"; ln -s real "$p/dirlink/s"; probe "$p/dirlink" dir-symlink
          mkdir -p "$p/unicode"; echo hi > "$p/unicode/rocket.txt"; probe "$p/unicode" plain-name
          mkdir -p "$p/hard"; echo hi > "$p/hard/a"; ln "$p/hard/a" "$p/hard/b"; probe "$p/hard" hardlink-pair
          mkdir -p "$p/readonly"; echo hi > "$p/readonly/r.txt"; chmod 444 "$p/readonly/r.txt"; probe "$p/readonly" read-only-file
          probe "$XPLAT_OUT/tree" the-fixture-tree
          probe "$XPLAT_OUT" the-hand-off-directory
      - uses: wow-look-at-my/buildhost/.github/actions/buildhost-handoff@lkgb
        with:
          mode: send
          name: xplat-${{ matrix.host }}
          path: build/xplat-out

  # Each host copies the tree every host sent, so a difference between hosts shows up as a named pair.
  cross-host:
    needs: every-host
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event.repository.visibility == 'public' && fromJSON('["ubuntu-latest","macos-latest","windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ (github.event.repository.visibility == 'public' || !contains(fromJSON('["ubuntu-latest"]'), matrix.os)) && matrix.os || vars.CI_RUNNER || matrix.os }}
    timeout-minutes: 20
    env:
      GO_TOOLCHAIN_DATS_BUILD_DIR: build/bin
      XPLAT_IN: build/xplat-in
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/buildhost/.github/actions/buildhost-handoff@lkgb
        with:
          mode: receive
          name: basicopy
          path: build/bin
      - uses: wow-look-at-my/buildhost/.github/actions/buildhost-handoff@lkgb
        with:
          mode: receive
          name: xplat-linux
          path: build/xplat-in/linux
      - uses: wow-look-at-my/buildhost/.github/actions/buildhost-handoff@lkgb
        with:
          mode: receive
          name: xplat-darwin
          path: build/xplat-in/darwin
      - uses: wow-look-at-my/buildhost/.github/actions/buildhost-handoff@lkgb
        with:
          mode: receive
          name: xplat-windows
          path: build/xplat-in/windows
      - id: dats
        uses: wow-look-at-my/buildhost/.github/actions/buildhost-download@lkgb
        with:
          project: dats
      - name: Copy every host's tree on this host
        shell: bash
        run: |
          set -euo pipefail
          cp "${{ steps.dats.outputs.path }}" build/dats.exe
          cp build/bin/basicopy build/bin/basicopy.exe
          chmod +x build/dats.exe build/bin/basicopy build/bin/basicopy.exe
          ./build/dats.exe -v --no-sandbox test xplat/receive.dats
